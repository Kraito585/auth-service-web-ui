server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Главное правило для React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Магия: перехватываем запросы к /auth/assets/ и отдаем реальную папку /assets/
    location /auth/assets/ {
        alias /usr/share/nginx/html/assets/;
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
}