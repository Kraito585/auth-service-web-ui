steps:
  # Единый шаг сборки статики (и для тестов PR, и для финальных образов)
  build-frontend:
    image: oven/bun:latest
    commands:
      - bun install
      - bun run build
    when:
      - event: [pull_request, push]
        branch: [main, kraito]
        evaluate: 'not (CI_COMMIT_MESSAGE contains "[build]")'

  # Комментарий в PR при успешной сборке
  pr-comment:
    image: curlimages/curl:latest
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    commands:
      - >
        curl -s -X POST 
        -H "Authorization: Bearer $GITHUB_TOKEN" 
        -H "Accept: application/vnd.github+json" 
        https://api.github.com/repos/$CI_REPO/issues/$CI_COMMIT_PULL_REQUEST/comments 
        -d '{"body": "✅ **Woodpecker CI:** Фронтенд успешно собран! Код готов к слиянию."}'
    when:
      - event: pull_request
        branch: main
        status: success

  # Публикация production-образа из ветки main
  publish-image-main:
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    settings:
      registry: ghcr.io
      repo: ghcr.io/kraito585/auth-service-web-ui
      tags: latest
      username: Kraito585
      password:
        from_secret: github_token
    when:
      - event: push
        branch: main
        evaluate: 'not (CI_COMMIT_MESSAGE contains "[build]")'

  # Публикация тестового образа из ветки kraito
  publish-image-kraito:
    image: woodpeckerci/plugin-docker-buildx
    privileged: true
    settings:
      registry: ghcr.io
      repo: ghcr.io/kraito585/auth-service-web-ui
      tags: test
      username: Kraito585
      password:
        from_secret: github_token
    when:
      - event: push
        branch: kraito
        evaluate: 'not (CI_COMMIT_MESSAGE contains "[build]")'

  # Деплой на сервер при обновлении ветки kraito
  deploy:
    image: appleboy/drone-ssh
    settings:
      host:
        from_secret: deploy_host
      username: deployer
      port: 22
      key:
        from_secret: deploy_ssh_key
      script:
        - echo $GITHUB_TOKEN | sudo /home/deployer/deploy-master.sh auth-service-web
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
    when:
      - event: push
        branch: kraito
        evaluate: 'not (CI_COMMIT_MESSAGE contains "[deploy]")'

when:
  - event: push
    branch:
      - main
      - kraito
  - event: pull_request
    branch: main